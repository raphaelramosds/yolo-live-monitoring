services:

  backend:
    build:
      context: ./backend
    container_name: yolo-live-monitoring-backend
    ports:
      - "8006:8000"
    env_file: ./backend/.env
    restart: unless-stopped
    develop:
      watch:
        - action: sync+restart
          path: ./backend/yolo_live_monitoring
          target: /app/yolo_live_monitoring
        - action: rebuild
          path: ./backend/pyproject.toml
        - action: rebuild
          path: ./backend/poetry.lock
        - action: rebuild
          path: ./backend/Dockerfile
    volumes:
      - ./data:/app/.data

  frontend:
    container_name: yolo-live-monitoring-frontend
    build:
      context: ./frontend
      target: dev
    ports:
      - "3007:3000"
    environment:
      - NODE_ENV=development
      # next dev reads NEXT_PUBLIC_* at startup, no build-arg needed
      - NEXT_PUBLIC_API_URL=http://localhost:8006
    # Enable Docker Compose Watch rules
    develop:
      watch:
        # Rebuild the image entirely if dependencies shift
        - action: rebuild
          path: ./frontend/package.json
        - action: rebuild
          path: ./frontend/package-lock.json
        - action: rebuild
          path: ./frontend/next.config.ts
        - action: rebuild
          path: ./frontend/postcss.config.mjs
        # Sync source and public files into the running container for HMR
        - action: sync
          path: ./frontend/src
          target: /app/src
        - action: sync
          path: ./frontend/public
          target: /app/public

  bstreamer:
    build:
      context: ./streaming
    container_name: yolo-live-monitoring-bstreamer
    ports:
      - "8558:8554"
    volumes:
      - ./streaming/video:/opt/bstreamer/video