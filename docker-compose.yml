services:
  backend:
    build:
      context: ./backend
    ports:
      - "8005:8000"
    env_file: ./backend/.env
    restart: unless-stopped
    develop:
      watch:
        - action: restart
          path: ./backend/yolo_live_monitoring
        - action: rebuild
          path: ./backend/pyproject.toml
        - action: rebuild
          path: ./backend/poetry.lock
        - action: rebuild
          path: ./backend/Dockerfile