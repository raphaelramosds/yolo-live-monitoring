[tool.poetry]
name = "yolo-live-monitoring-backend"
version = "0.1.0"
description = "YOLO Live Monitoring System with FastAPI"
authors = ["Raphael Ramos <raphael.opensource@gmail.com>"]
packages = [{ include = "yolo_live_monitoring" }]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.110.0"
uvicorn = "^0.28.0"
pydantic = "^2.13.4"
pydantic-settings = "^2.14.1"
dependency-injector = "^4.41.0"
onnxruntime = "^1.20.0"
opencv-python-headless = "^4.10.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=9.0.3,<10.0.0"
pytest-asyncio = "^1.3.0"
ultralytics = "^8.3.0"